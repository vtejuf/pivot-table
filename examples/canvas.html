<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pivot-table · 独立 Canvas 示例</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --accent: #2563eb;
        --page: #f1f5f9;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 14px/1.6 var(--sans);
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      header h1 {
        margin: 6px 0 8px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      header p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      header a {
        color: var(--accent);
        text-decoration: none;
      }
      header a:hover {
        text-decoration: underline;
      }
      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 12px 34px rgb(15 23 42 / 0.06);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: #f8fafc;
        padding: 14px 16px;
      }
      .field {
        display: grid;
        gap: 4px;
      }
      .field span {
        color: var(--muted);
        font-size: 11px;
      }
      select,
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: inherit;
        font: inherit;
        padding: 7px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover,
      select:hover {
        border-color: #94a3b8;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        padding-bottom: 8px;
        font-size: 13px;
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      .check input:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      select:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .range {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 7px;
      }
      .range input {
        width: 140px;
        accent-color: var(--accent);
      }
      #zoom-label {
        width: 48px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        text-align: right;
      }
      .toolbar button {
        margin-left: auto;
      }
      #pivot {
        display: block;
        width: 100%;
        height: 560px;
        cursor: grab;
        touch-action: none;
      }
      #pivot.is-dragging {
        cursor: grabbing;
      }
      #pivot:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .status {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        border-top: 1px solid var(--line);
        background: #f8fafc;
        padding: 10px 16px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .status strong {
        color: var(--ink);
      }
      .demo-error {
        margin: 0;
        border-top: 1px solid #fecaca;
        background: #fef2f2;
        padding: 10px 16px;
        color: #b91c1c;
        font-size: 12px;
      }
      .hint {
        margin: 12px 2px 0;
        color: var(--muted);
        font-size: 12px;
      }
      code {
        border-radius: 4px;
        background: #e2e8f0;
        padding: 1px 5px;
        font-family: var(--mono);
        font-size: 11px;
      }
      @media (max-width: 720px) {
        .field,
        .check,
        .range {
          flex: 1 1 100%;
        }
        .toolbar button {
          flex: 1 1 100%;
          margin-left: 0;
        }
        #pivot {
          height: 420px;
        }
        .status {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">examples · canvas</p>
        <h1>独立 Canvas 渲染示例</h1>
        <p>
          与主页共用 <code>site/demo.mjs</code> 控制器。
          <a href="../index.html">返回主页</a>
        </p>
      </header>

      <section class="panel">
        <div class="toolbar">
          <label class="field">
            <span>布局模式</span>
            <select id="mode" data-demo-mode>
              <option value="compact" selected>compact · 紧凑块</option>
              <option value="cartesian">cartesian · 规则网格</option>
            </select>
          </label>
          <label class="field">
            <span>度量</span>
            <select id="measure" data-demo-measure>
              <option value="sales">销售额 sum</option>
              <option value="count">订单数 count</option>
            </select>
          </label>
          <label class="check">
            <input id="dual-measure" type="checkbox" data-demo-dual-measure />
            并列度量
          </label>
          <label class="check">
            <input id="heatmap" type="checkbox" data-demo-heatmap checked />
            数值色阶
          </label>
          <label class="range">
            <span>列宽</span>
            <input
              id="cell-width"
              type="range"
              data-demo-width
              min="56"
              max="168"
              step="4"
              value="104"
            />
            <span id="zoom-label" data-demo-zoom>104px</span>
          </label>
          <button id="reset" type="button" data-demo-reset>回到左上角</button>
        </div>

        <canvas
          id="pivot"
          data-demo-canvas
          tabindex="0"
          aria-label="透视表 Canvas 示例：滚轮、拖拽或方向键平移"
        ></canvas>

        <div class="status">
          <span id="grid-size" data-demo-grid-size></span>
          <span id="stats" data-demo-stats></span>
          <span id="matrix-info" data-demo-matrix></span>
        </div>
        <p class="demo-error" data-demo-error role="alert" hidden></p>
      </section>

      <p class="hint">
        需要通过 HTTP 打开：<code>python3 -m http.server 8000</code>，然后访问
        <code>http://localhost:8000/examples/canvas.html</code>。滚轮 / 拖拽 /
        方向键平移，表头冻结。
      </p>
    </main>

    <script type="module">
      import { createPivotDemo } from '../site/demo.mjs';

      const compactViewport = window.matchMedia('(max-width: 720px)');
      try {
        createPivotDemo(document.body, {
          height: () => (compactViewport.matches ? 420 : 560),
        });
      } catch (error) {
        console.error(error);
        const target = document.querySelector('[data-demo-error]');
        if (target) {
          target.hidden = false;
          target.textContent = `Demo 初始化失败：${error.message}`;
        }
      }
    </script>
  </body>
</html>
